The tax wedge represents the total tax burden on labor or the difference between what an employer pays (total labor cost) and what the employee takes home (net disposable income). It includes personal income taxes, plus both employee and employer social security contributions.

Western and Central European nations typically have the highest overall tax burdens on average earners, heavily driven by substantial social security and health insurance contributions. The highest tax can be found in Belgium&#x1f1e7;&#x1f1ea;: 52.6%
